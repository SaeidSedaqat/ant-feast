<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a2836">
  <title>Ant Feast</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff7e6;
      background: #3a2836 linear-gradient(180deg, #2c2033 0%, #4a3140 45%, #6e4a45 75%, #7d5848 100%);
    }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); box-sizing: border-box; }
    #top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pill { background: rgba(30, 16, 12, 0.62); border-radius: 999px; padding: 0.3em 0.8em; font-size: clamp(13px, 1.9vmin, 22px); white-space: nowrap; }
    #eaten { display: flex; align-items: center; gap: 0.5em; }
    #eaten .track { width: clamp(60px, 14vw, 160px); height: 0.6em; background: rgba(255,255,255,0.18); border-radius: 99px; overflow: hidden; }
    #eaten .fillbar { display: block; height: 100%; background: linear-gradient(90deg, #ffcf6b, #ff8a4a); transition: width 0.3s; }
    #crumbs { font-size: clamp(17px, 2.8vmin, 32px); font-weight: 700; color: #ffe2a8; }
    #spacer { flex: 1; }
    .small { font-size: clamp(11px, 1.5vmin, 17px); opacity: 0.85; }
    .ic { display: inline-block; width: 0.8em; height: 0.75em; margin-right: 0.3em; background: #e9b872;
      clip-path: polygon(10% 35%, 50% 0, 100% 30%, 85% 100%, 20% 95%); vertical-align: -0.05em; }
    #hint { align-self: center; margin-top: 10px; background: rgba(255, 236, 190, 0.92); color: #3b1d08; font-weight: 600;
      border-radius: 12px; padding: 0.45em 0.9em; font-size: clamp(14px, 2.1vmin, 24px); text-align: center; max-width: 90%;
      animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.04); } }
    #fill { flex: 1; }
    button { pointer-events: auto; font: inherit; color: inherit; cursor: pointer; border: 0; }
    #bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(30vw, 150px), 1fr)); max-width: 980px; width: 100%; align-self: center; gap: 6px; }
    #bar button { padding: 0.35em 0.5em; border-radius: 12px; font-size: clamp(12px, 1.9vmin, 20px);
      background: linear-gradient(#ffcf6b, #e8962e); color: #3b1d08; box-shadow: 0 4px 0 #8a4a10; display: flex; flex-direction: column; align-items: center; }
    #bar button span { font-size: 0.78em; opacity: 0.85; }
    #bar button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #8a4a10; }
    #bar button:disabled { filter: grayscale(0.7) brightness(0.75); cursor: default; }
    #bar button:focus-visible, .pill:focus-visible { outline: 3px solid #fff; }
    button.pill { color: #fff7e6; }
    #pad { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
    #pad .grp { display: flex; gap: 8px; }
    #pad button { width: clamp(48px, 13vmin, 72px); height: clamp(48px, 13vmin, 72px); border-radius: 50%; font-size: clamp(18px, 5vmin, 28px);
      background: rgba(255, 236, 190, 0.85); color: #3b1d08; box-shadow: 0 3px 0 rgba(90, 44, 0, 0.6);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #pad button.bite { width: clamp(76px, 20vmin, 110px); border-radius: 999px; background: #d8434f; color: #fff; font-weight: 800; font-size: clamp(15px, 4vmin, 22px); }
    #pad button.on { transform: translateY(3px); box-shadow: 0 0 0 rgba(0, 0, 0, 0); filter: brightness(0.85); }
    [hidden] { display: none !important; }
    #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      background: #3a2836 linear-gradient(180deg, #2c2033 0%, #4a3140 45%, #6e4a45 75%, #7d5848 100%); transition: opacity 0.4s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .lbox { text-align: center; width: min(80vw, 420px); }
    .logo-ant { width: min(40vw, 170px); animation: antbob 0.6s ease-in-out infinite alternate; }
    @keyframes antbob { to { transform: translateY(-5px) rotate(-2deg); } }
    #loading .logo { margin: 0.1em 0 0.6em; font-size: clamp(40px, 11vmin, 84px); font-weight: 900; letter-spacing: 0.02em; color: #ffe2a8;
      text-shadow: 0 4px 0 #8a4a10, 0 8px 18px rgba(0,0,0,0.4); line-height: 1; }
    #loading .logo span { color: #ff9a5a; }
    .ltrack { height: 14px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
    #lbar { height: 100%; width: 0; background: linear-gradient(90deg, #ffcf6b, #ff8a4a); border-radius: 99px; transition: width 0.15s; }
    #lpct { margin-top: 0.5em; font-size: clamp(15px, 2.6vmin, 22px); font-weight: 700; color: #ffe2a8; }
    #win { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 10, 8, 0.6); pointer-events: auto; }
    #win div { background: #fff1d6; color: #3b1d08; border-radius: 20px; padding: 1.4em 2em; text-align: center; font-size: clamp(16px, 2.6vmin, 30px); max-width: 80vw; }
    #win h1 { margin: 0 0 0.3em; font-size: 1.8em; }
    #win button { margin-top: 1em; background: #e8962e; color: #3b1d08; padding: 0.5em 1.4em; border-radius: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui">
    <div id="top">
      <div class="pill" id="crumbs"></div>
      <div class="pill" id="eaten"></div>
      <div class="pill" id="colony" hidden></div>
      <div id="spacer"></div>
      <div class="pill small" id="time"></div>
      <button class="pill small" id="bMute"></button>
      <button class="pill small" id="bReset">Restart</button>
      <div class="pill small" id="ver"></div>
    </div>
    <div id="hint" hidden></div>
    <div id="fill"></div>
    <div id="bar">
      <button id="bJaws"></button>
      <button id="bTrail"></button>
      <button id="bAnt" hidden></button>
      <button id="bSoldier" hidden></button>
      <button id="bSpeed" hidden></button>
      <button id="bCarry" hidden></button>
      <button id="bBite" hidden></button>
    </div>
    <div id="pad" hidden>
      <div class="grp"><button data-k="left" aria-label="Walk left">◀</button><button data-k="right" aria-label="Walk right">▶</button></div>
      <div class="grp"><button data-k="bite" class="bite">BITE</button></div>
    </div>
  </div>
  <div id="win" hidden>
    <div>
      <h1>The table is clean!</h1>
      <p>Your colony ate the whole feast in <b id="winTime"></b>.</p>
      <p class="small">Cake, bread and grapes: all gone.</p>
      <button id="bAgain">Play again</button>
    </div>
  </div>
  <div id="loading">
    <div class="lbox">
      <svg class="logo-ant" viewBox="0 0 120 70" aria-hidden="true">
        <g stroke="#2a140c" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M44 44 L34 62 M56 46 L54 64 M68 44 L76 62"/><path d="M44 40 L30 30 M56 38 L52 24 M68 40 L80 28"/>
          <path d="M92 30 Q100 12 112 10 M90 28 Q92 10 100 4"/>
        </g>
        <ellipse cx="28" cy="40" rx="20" ry="13" fill="#3b1d10"/>
        <ellipse cx="60" cy="40" rx="12" ry="8" fill="#4a2616"/>
        <circle cx="88" cy="36" r="11" fill="#3b1d10"/>
        <circle cx="92" cy="33" r="2.6" fill="#fff7e6"/>
        <ellipse cx="22" cy="34" rx="7" ry="3" fill="#6e3a22"/>
        <path d="M104 42 l10 -2 -6 8 z" fill="#e9b872"/>
      </svg>
      <h1 class="logo">Ant <span>Feast</span></h1>
      <div class="ltrack"><div id="lbar"></div></div>
      <div id="lpct">0%</div>
    </div>
  </div>
  <script>
  (function () {
    // Byte-weighted loader: download every script with progress, then run them in order.
    var files = [
      ['lib/phaser-4.2.1.min.js', 1375976],
      ['src/config.js?v=0.0.107', 4000], ['src/food.js?v=0.0.107', 20000], ['src/art.js?v=0.0.107', 12000],
      ['src/walker.js?v=0.0.107', 5000], ['src/support.js?v=0.0.107', 8000], ['src/ui.js?v=0.0.107', 10000],
      ['src/GameScene.js?v=0.0.107', 40000], ['src/main.js?v=0.0.107', 1500]
    ];
    var bar = document.getElementById('lbar'), pct = document.getElementById('lpct');
    var total = 0, got = files.map(function () { return 0; }), shown = 0, texts = [];
    files.forEach(function (f) { total += f[1]; });
    window.AFLoad = function (p) {
      p = Math.max(shown, Math.min(100, Math.floor(p))); shown = p;
      bar.style.width = p + '%'; pct.textContent = p + '%';
    };
    function upd() { var s = 0; got.forEach(function (g, i) { s += Math.min(g, files[i][1]); }); AFLoad(92 * s / total); }
    var left = files.length;
    files.forEach(function (f, i) {
      var x = new XMLHttpRequest();
      x.open('GET', f[0]);
      x.onprogress = function (e) { got[i] = e.loaded; upd(); };
      x.onload = function () { if (x.status >= 400) return x.onerror(); got[i] = f[1]; texts[i] = x.responseText; upd(); if (--left === 0) run(0); };
      x.onerror = function () { pct.textContent = 'Could not load. Check your connection and reload.'; };
      x.send();
    });
    function run(i) {
      if (i >= files.length) { AFLoad(96); return; }
      var s = document.createElement('script');
      s.text = texts[i] + '\n//# sourceURL=' + f0(files[i][0]);
      document.body.appendChild(s); AFLoad(92 + 4 * (i + 1) / files.length);
      setTimeout(function () { run(i + 1); }, 0);
    }
    function f0(u) { return new URL(u, location.href).href; }
    window.AFLoaded = function () {
      AFLoad(100);
      var el = document.getElementById('loading');
      setTimeout(function () { el.classList.add('done'); setTimeout(function () { el.remove(); }, 450); }, 200);
    };
  })();
  </script>
</body>
</html>
