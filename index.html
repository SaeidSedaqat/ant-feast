<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a2836">
  <title>Ant Feast</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {

    }
    /* a warm room behind the table: lamp light and soft, slowly breathing spots of light */
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;

    body::after { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; animation: glowspots 7s ease-in-out infinite alternate;
      background: radial-gradient(circle at 22% 16%, rgba(255, 226, 168, 0.16) 0, rgba(255, 226, 168, 0.16) 2.2vmin, transparent 2.6vmin),
        radial-gradient(circle at 38% 30%, rgba(255, 190, 150, 0.12) 0, rgba(255, 190, 150, 0.12) 3.4vmin, transparent 3.9vmin),
        radial-gradient(circle at 61% 11%, rgba(255, 236, 190, 0.13) 0, rgba(255, 236, 190, 0.13) 1.6vmin, transparent 2vmin),
        radial-gradient(circle at 71% 34%, rgba(255, 170, 140, 0.10) 0, rgba(255, 170, 140, 0.10) 2.8vmin, transparent 3.3vmin),
        radial-gradient(circle at 91% 27%, rgba(255, 226, 168, 0.12) 0, rgba(255, 226, 168, 0.12) 2vmin, transparent 2.4vmin),

    @keyframes glowspots { from { opacity: 0.55; } to { opacity: 1; } }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); box-sizing: border-box; }
    #top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pill { background: rgba(38, 20, 16, 0.74); border-radius: 999px; padding: 0.3em 0.8em; font-size: clamp(13px, 1.9vmin, 22px); white-space: nowrap;
      border: 1px solid rgba(255, 226, 168, 0.16); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
    button.pill { transition: transform 0.08s, filter 0.12s; }
    button.pill:hover { filter: brightness(1.2); }
    button.pill:active { transform: translateY(1px) scale(0.97); }
    #eaten { display: flex; align-items: center; gap: 0.5em; }
    #eaten .track { width: clamp(60px, 14vw, 160px); height: 0.6em; background: rgba(0, 0, 0, 0.35); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
    #eaten .fillbar { display: block; height: 100%; border-radius: 99px; background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent 55%), linear-gradient(90deg, #ffcf6b, #ff8a4a); transition: width 0.3s; }

    #spacer { flex: 1; }

    #hint { align-self: center; margin-top: 10px; background: rgba(255, 240, 204, 0.95); color: #3b1d08; font-weight: 600; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3), 0 2px 0 #c98a3c;
      border-radius: 12px; padding: 0.45em 0.9em; font-size: clamp(14px, 2.1vmin, 24px); text-align: center; max-width: 90%;

    @keyframes pulse { 50% { transform: scale(1.04); } }
    #fill { flex: 1; }
    button { pointer-events: auto; font: inherit; color: inherit; cursor: pointer; border: 0; }
    button:focus-visible, .pill:focus-visible { outline: 3px solid #fff; }
    button.pill { color: #fff7e6; }
    #bPanel { font-weight: 800; background: linear-gradient(#ffb44a, #e8862a); color: #3b1d08; border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 2px 0 #a8561c, 0 4px 10px rgba(0, 0, 0, 0.3); }
    #bPanel.on { background: linear-gradient(#ffe29a, #ffc85a); }
    #eaten { cursor: pointer; } #eaten:hover, #eaten.on { box-shadow: 0 0 0 2px #ffcf6b inset; }
    i.n { font-style: normal; display: inline-block; min-width: 1.3em; padding: 0 0.3em; margin-left: 0.3em; border-radius: 99px;
      background: #d8434f; color: #fff; font-size: 0.8em; font-weight: 800; text-align: center; box-sizing: border-box; }
    #side { position: fixed; left: max(8px, env(safe-area-inset-left)); top: 54px; bottom: 8px; width: min(330px, 92vw); z-index: 5;
      display: flex; flex-direction: column; pointer-events: auto; background: rgba(40, 22, 16, 0.92); border-radius: 14px; overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4); font-size: clamp(13px, 1.7vmin, 16px); border: 1px solid rgba(255, 226, 168, 0.2); animation: sidein 0.2s ease-out; }
    @keyframes sidein { from { opacity: 0; transform: translateX(-14px); } }
    .shead { display: flex; align-items: center; justify-content: space-between; padding: 0.45em 0.5em 0.45em 0.9em; color: #ffe2a8; font-weight: 800; font-size: 1.1em; letter-spacing: 0.02em; }
    #bClose { width: 1.8em; height: 1.8em; border-radius: 50%; background: rgba(255, 255, 255, 0.12); color: #ffe2a8; font-weight: 800; line-height: 1; }
    #bClose:hover { background: rgba(255, 255, 255, 0.22); }
    #side .pane { flex: 1; overflow-y: auto; background: #fff1d6; color: #3b1d08; padding: 6px 7px; touch-action: pan-y; -webkit-overflow-scrolling: touch;
      box-shadow: inset 0 4px 6px -3px rgba(59, 29, 8, 0.3); scrollbar-width: thin; scrollbar-color: #d9b98a transparent; }
    .hd { display: flex; justify-content: space-between; font-weight: 800; margin: 0.8em 0.2em 0.35em; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.04em; color: #7a5632; }
    .hd span { background: rgba(59, 29, 8, 0.12); border-radius: 99px; padding: 0 0.6em; color: #3b1d08; }
    .sec { display: flex; align-items: center; gap: 0.45em; font-weight: 900; font-size: 1.08em; margin: 1em 0.2em 0.45em; padding-bottom: 0.25em; border-bottom: 2px solid rgba(59,29,8,0.18); }
    .sec::before { content: ''; width: 0.5em; height: 1em; border-radius: 3px; background: linear-gradient(#ffb44a, #d8434f); }
    .sec:first-child { margin-top: 0.2em; }
    .up { position: relative; overflow: hidden; display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; margin-bottom: 7px; padding: 0.5em 0.6em; border-radius: 12px;

    .up:hover:not(:disabled) { filter: brightness(1.06); }
    .up:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #a8621c, inset 0 1px 0 rgba(255, 255, 255, 0.55); }
    .up:disabled { background: #eadcc4; box-shadow: 0 3px 0 #cdbb9d; cursor: default; color: #6b5640; }
    .up:disabled::after { content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: var(--p, 0%); background: linear-gradient(90deg, #f0a645, #e8862a); border-radius: 0 3px 0 0; transition: width 0.2s; }
    .up.pop { animation: bought 0.3s ease-out; }
    @keyframes bought { 30% { transform: scale(0.97); filter: brightness(1.35); } 65% { transform: scale(1.02); } }
    .up .nm { flex: 1; min-width: 0; }
    .up .nm em { font-style: normal; font-size: 0.85em; opacity: 0.75; }
    .up .nm small { display: block; font-size: 0.82em; opacity: 0.8; margin-top: 0.1em; }
    .lvb { display: inline-block; width: 3.4em; height: 0.42em; margin-left: 0.45em; vertical-align: 0.12em; border-radius: 99px; background: rgba(59, 29, 8, 0.2); overflow: hidden; }
    .lvb i { display: block; height: 100%; border-radius: 99px; background: #7a3a12; }
    .up:disabled .lvb i { background: #9a7c5c; }
    .pr { font-weight: 800; white-space: nowrap; background: rgba(59, 29, 8, 0.13); border-radius: 99px; padding: 0.2em 0.65em; }
    .pr.no { font-weight: 600; font-size: 0.85em; opacity: 0.7; background: none; padding: 0; }
    #toasts { position: fixed; left: 50%; top: 100px; transform: translateX(-50%); z-index: 8; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(90vw, 460px); }
    .toast { background: rgba(30, 16, 12, 0.9); color: #fff7e6; border-radius: 12px; padding: 0.5em 1em; font-size: clamp(14px, 2vmin, 20px);
      border: 1px solid rgba(255, 226, 168, 0.18); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      text-align: center; animation: tin 0.35s cubic-bezier(0.2, 1.5, 0.4, 1); transition: opacity 0.5s, transform 0.5s; }
    .toast.gold { background: linear-gradient(#ffe09a, #f0a645); color: #3b1d08; font-weight: 700; border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 3px 0 #a8621c, 0 6px 18px rgba(0, 0, 0, 0.35); }
    .toast.out { opacity: 0; transform: translateY(-10px); }
    @keyframes tin { from { opacity: 0; transform: translateY(8px) scale(0.8); } }
    #dev { position: fixed; right: 8px; bottom: 8px; z-index: 9; pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; max-width: min(60vw, 520px);
      background: rgba(0,0,0,0.7); padding: 6px; border-radius: 10px; font-size: 12px; align-items: center; }
    #dev b { color: #ff8a8a; margin-right: 4px; }
    #dev button { background: #444; color: #fff; padding: 3px 7px; border-radius: 6px; }
    @media (max-width: 1000px) { #ver { display: none; } }
    #pad button.sm { width: clamp(40px, 11vmin, 60px); height: clamp(40px, 11vmin, 60px); font-size: clamp(12px, 3vmin, 16px); font-weight: 700; }
    #pad { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
    #pad .grp { display: flex; gap: 8px; }
    #pad button { width: clamp(48px, 13vmin, 72px); height: clamp(48px, 13vmin, 72px); border-radius: 50%; font-size: clamp(18px, 5vmin, 28px);
      background: linear-gradient(rgba(255, 244, 214, 0.92), rgba(255, 222, 160, 0.9)); color: #3b1d08; box-shadow: 0 3px 0 rgba(90, 44, 0, 0.6), 0 6px 12px rgba(0, 0, 0, 0.25);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #pad button.bite { width: clamp(76px, 20vmin, 110px); border-radius: 999px; background: linear-gradient(#ee5a66, #c8323e); color: #fff; font-weight: 800; font-size: clamp(15px, 4vmin, 22px); }
    #pad button.on { transform: translateY(3px); box-shadow: 0 0 0 rgba(0, 0, 0, 0); filter: brightness(0.85); }
    [hidden] { display: none !important; }
    #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      background: #3a2836 linear-gradient(180deg, #2c2033 0%, #4a3140 45%, #6e4a45 75%, #7d5848 100%); transition: opacity 0.4s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .lbox { text-align: center; width: min(80vw, 420px); }
    .logo-ant { width: min(40vw, 170px); animation: antbob 0.6s ease-in-out infinite alternate; }
    @keyframes antbob { to { transform: translateY(-5px) rotate(-2deg); } }
    #loading .logo { margin: 0.1em 0 0.6em; font-size: clamp(40px, 11vmin, 84px); font-weight: 900; letter-spacing: 0.02em; color: #ffe2a8;
      text-shadow: 0 4px 0 #8a4a10, 0 8px 18px rgba(0,0,0,0.4); line-height: 1; }
    #loading .logo span { color: #ff9a5a; }
    .ltrack { height: 14px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
    #lbar { height: 100%; width: 0; background: linear-gradient(90deg, #ffcf6b, #ff8a4a); border-radius: 99px; transition: width 0.15s; }
    #lpct { margin-top: 0.5em; font-size: clamp(15px, 2.6vmin, 22px); font-weight: 700; color: #ffe2a8; }
    #win { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(20, 10, 8, 0.6); pointer-events: auto; }
    #win { animation: winfade 0.3s ease-out; }

    #win div { background: linear-gradient(#fff6e2, #ffe9c2); color: #3b1d08; border-radius: 20px; padding: 1.4em 2em; text-align: center; font-size: clamp(16px, 2.6vmin, 30px); max-width: 80vw;
      box-shadow: 0 6px 0 #c98a3c, 0 18px 40px rgba(0, 0, 0, 0.5); animation: winpop 0.45s cubic-bezier(0.2, 1.5, 0.4, 1); }
    @keyframes winpop { from { transform: scale(0.6); } }
    #win h1 { margin: 0 0 0.3em; font-size: 1.8em; color: #a8461c; }
    #win button { margin-top: 1em; background: linear-gradient(#ffb44a, #e8862a); color: #3b1d08; padding: 0.5em 1.4em; border-radius: 12px; font-weight: 800; margin-left: 0.3em; margin-right: 0.3em; box-shadow: 0 3px 0 #a8561c; }
    #win button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a8561c; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui">
    <div id="top">
      <div class="pill" id="crumbs"></div>
      <div class="pill" id="eaten"></div>
      <div class="pill" id="colony" hidden></div>
      <div class="pill small" id="boosts" hidden></div>
      <div id="spacer"></div>
      <div class="pill small" id="time"></div>
      <button class="pill small" id="bMute"></button>
      <button class="pill small" id="bReset">Restart</button>
      <div class="pill small" id="ver"></div>
      <button class="pill" id="bPanel">Upgrades</button>
    </div>
    <div id="hint" hidden></div>
    <div id="fill"></div>
    <div id="pad" hidden>
      <div class="grp"><button data-k="left" aria-label="Walk left">◀</button><button data-k="right" aria-label="Walk right">▶</button></div>
      <div class="grp"><button data-k="bite" class="bite">BITE</button></div>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="side" hidden>
    <div class="shead"><span>Upgrades</span><button id="bClose" aria-label="Close upgrades">×</button></div>
    <div class="pane" id="p_all"></div>
  </div>
  <div id="dev" hidden></div>
  <div id="win" hidden>
    <div>
      <h1>The Giant Cake is gone!</h1>
      <p>Your colony ate the whole cake in <b id="winTime"></b>.</p>
      <button id="bKeep">Keep looking</button><button id="bAgain">Play again</button>
    </div>
  </div>
  <div id="loading">
    <div class="lbox">
      <svg class="logo-ant" viewBox="0 0 120 70" aria-hidden="true">
        <g stroke="#2a140c" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M44 44 L34 62 M56 46 L54 64 M68 44 L76 62"/><path d="M44 40 L30 30 M56 38 L52 24 M68 40 L80 28"/>
          <path d="M92 30 Q100 12 112 10 M90 28 Q92 10 100 4"/>
        </g>
        <ellipse cx="28" cy="40" rx="20" ry="13" fill="#3b1d10"/>
        <ellipse cx="60" cy="40" rx="12" ry="8" fill="#4a2616"/>
        <circle cx="88" cy="36" r="11" fill="#3b1d10"/>
        <circle cx="92" cy="33" r="2.6" fill="#fff7e6"/>
        <ellipse cx="22" cy="34" rx="7" ry="3" fill="#6e3a22"/>
        <path d="M104 42 l10 -2 -6 8 z" fill="#e9b872"/>
      </svg>
      <h1 class="logo">Ant <span>Feast</span></h1>
      <div class="ltrack"><div id="lbar"></div></div>
      <div id="lpct">0%</div>
    </div>
  </div>
  <script>
  (function () {
    // Byte-weighted loader: download every script with progress, then run them in order.
    var files = [
      ['lib/phaser-4.2.1.min.js', 1375976],
      ['src/config.js?v=0.0.238', 6000], ['src/food.js?v=0.0.238', 14000], ['src/art.js?v=0.0.238', 12000],
      ['src/walker.js?v=0.0.238', 5000], ['src/support.js?v=0.0.238', 8000], ['src/ui.js?v=0.0.238', 9000],
      ['src/GameScene.js?v=0.0.238', 50000], ['src/main.js?v=0.0.238', 1500]
    ];
    var bar = document.getElementById('lbar'), pct = document.getElementById('lpct');
    var total = 0, got = files.map(function () { return 0; }), shown = 0, texts = [];
    files.forEach(function (f) { total += f[1]; });
    window.AFLoad = function (p) {
      p = Math.max(shown, Math.min(100, Math.floor(p))); shown = p;
      bar.style.width = p + '%'; pct.textContent = p + '%';
    };
    function upd() { var s = 0; got.forEach(function (g, i) { s += Math.min(g, files[i][1]); }); AFLoad(92 * s / total); }
    var left = files.length;
    files.forEach(function (f, i) {
      var x = new XMLHttpRequest();
      x.open('GET', f[0]);
      x.onprogress = function (e) { got[i] = e.loaded; upd(); };
      x.onload = function () { if (x.status >= 400) return x.onerror(); got[i] = f[1]; texts[i] = x.responseText; upd(); if (--left === 0) run(0); };
      x.onerror = function () { pct.textContent = 'Could not load. Check your connection and reload.'; };
      x.send();
    });
    function run(i) {
      if (i >= files.length) { AFLoad(96); return; }
      var s = document.createElement('script');
      s.text = texts[i] + '\n//# sourceURL=' + f0(files[i][0]);
      document.body.appendChild(s); AFLoad(92 + 4 * (i + 1) / files.length);
      setTimeout(function () { run(i + 1); }, 0);
    }
    function f0(u) { return new URL(u, location.href).href; }
    window.AFLoaded = function () {
      AFLoad(100);
      var el = document.getElementById('loading');
      setTimeout(function () { el.classList.add('done'); setTimeout(function () { el.remove(); }, 450); }, 200);
    };
  })();
  </script>
</body>
